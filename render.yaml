services:
  # The .NET Orchestrator
  - type: web
    name: olubanise-orchestrator
    runtime: docker
    dockerContext: src/orchestrator/Olubanise.Orchestrator
    dockerfilePath: Dockerfile
    envVars:
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: olubanise-db
          property: connectionString
      - key: ANTHROPIC__APIKEY
        sync: false
      - key: WORKER__SHAREDSECRET
        generateValue: true
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: ANTHROPIC__BYPASSBILLING
        value: "false"
    healthCheckPath: /api/sessions/health

  # The Node.js Worker
  - type: worker
    name: olubanise-worker
    runtime: docker
    dockerContext: src/worker
    dockerfilePath: Dockerfile
    envVars:
      - key: ORCHESTRATOR_URL
        fromService:
          type: web
          name: olubanise-orchestrator
          property: host
      - key: WORKER_SECRET
        fromService:
          type: web
          name: olubanise-orchestrator
          envVarKey: WORKER__SHAREDSECRET
      - key: ENCRYPTION_KEY
        sync: false

  # The React Frontend
  - type: web
    name: olubanise-web
    runtime: docker
    dockerContext: src/web
    dockerfilePath: Dockerfile
    envVars:
      - key: VITE_API_BASE
        fromService:
          type: web
          name: olubanise-orchestrator
          property: host

databases:
  - name: olubanise-db
    databaseName: olubanise
    user: olubanise_user
    plan: free

