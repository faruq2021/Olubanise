services:
  db:
    image: postgres:15-alpine
    container_name: olubanise-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: olubanise
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./schema:/docker-entrypoint-initdb.d:ro
    networks:
      - olubanise-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  orchestrator:
    build:
      context: ./src/orchestrator/Olubanise.Orchestrator
      dockerfile: Dockerfile
    container_name: olubanise-orchestrator
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Database=olubanise;Username=postgres;Password=password
      - ANTHROPIC__APIKEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC__BYPASSBILLING=${BYPASS_BILLING:-false}
      - WORKER__SHAREDSECRET=${WORKER_SHARED_SECRET}
      - ASPNETCORE_URLS=http://+:8080
    ports:
      - "5241:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - olubanise-net
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/api/sessions/health" ]
      interval: 10s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: ./src/worker
      dockerfile: Dockerfile
    container_name: olubanise-worker
    environment:
      - ORCHESTRATOR_URL=http://orchestrator:8080
      - WORKER_SECRET=${WORKER_SHARED_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    depends_on:
      orchestrator:
        condition: service_healthy
    networks:
      - olubanise-net

  web:
    build:
      context: ./src/web
      dockerfile: Dockerfile
    container_name: olubanise-web
    ports:
      - "5173:80"
    depends_on:
      orchestrator:
        condition: service_healthy
    networks:
      - olubanise-net

networks:
  olubanise-net:
    driver: bridge

volumes:
  db-data:
